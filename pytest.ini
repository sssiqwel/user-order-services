[pytest]
testpaths = tests
addopts = -v --junitxml=reports/pytest.xml
markers =
    bigbang: одноэтапная интеграция всех модулей (метод «большого взрыва»)
    bigbang_defect: дефект, выявленный на полной сборке без поэтапной изоляции
    hybrid: гибридное (сэндвич) тестирование слоёв: интерфейс, бизнес-логика, доступ к данным
    hybrid_defect: дефект, локализованный драйвером или заглушкой на конкретном слое
filterwarnings =
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning
